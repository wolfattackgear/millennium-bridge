name: Puxador Millennium -> gist

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: puller-millennium
  cancel-in-progress: false

jobs:
  guarda:
    runs-on: ubuntu-latest
    outputs:
      rodar: ${{ steps.chk.outputs.rodar }}
    steps:
      - id: chk
        name: O PC servidor está vivo?
        run: |
          STATUS=$(curl -s --max-time 20 \
            "https://sistema.wolfattack.com.br/projeto/canal-ml/api/agente-status.php?fmt=txt&key=${{ secrets.CRON_SECRET }}" \
            || echo "MORTO")
          echo "status=$STATUS"
          if [ "$STATUS" = "VIVO" ]; then
            echo "PC vivo — a nuvem NÃO roda (evita sessão dupla no Millennium)."
            echo "rodar=nao" >> "$GITHUB_OUTPUT"
          else
            echo "PC mudo — a nuvem ASSUME."
            echo "rodar=sim" >> "$GITHUB_OUTPUT"
          fi

  puxar:
    needs: guarda
    if: needs.guarda.outputs.rodar == 'sim'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar puxador
        env:
          MILLENNIUM_URL:  ${{ secrets.MILLENNIUM_URL }}
          MILLENNIUM_USER: ${{ secrets.MILLENNIUM_USER }}
          MILLENNIUM_PASS: ${{ secrets.MILLENNIUM_PASS }}
          VITRINE:         ${{ secrets.VITRINE }}
          SALDO_FIELD:     ${{ secrets.SALDO_FIELD }}
          SINK:            gist
          GIST_ID:         ${{ secrets.GIST_ID }}
          GIST_TOKEN:      ${{ secrets.GIST_TOKEN }}
          MAX_PAGES:       "50"
          HTTP_TIMEOUT:    "60"
          DRY_RUN:         ${{ secrets.DRY_RUN }}
        run: python puller.py
