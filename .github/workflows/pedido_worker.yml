name: Pedidos ML -> Millennium (criar + colher NF)

# O canal-ml NAO fatura. Este worker:
#   - cadastra o pedido de venda no Millennium e APROVA (processastatus=1),
#     igual o 4Middleware ("Cadastrar pedido e posteriormente processastatus aprovando");
#   - colhe o XML das notas que o OPERADOR ja faturou e devolve pro canal-ml,
#     que anexa no Mercado Livre.
#
# SEGURANCA: WORKER_ENABLED comeca 0 (nao cria nem colhe nada). Ligue o secret
# WORKER_ENABLED=1 depois de validar o dry-run e os valores (vitrine, tipo_pgto).

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: pedido-worker-millennium
  cancel-in-progress: false

jobs:
  pedidos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar worker de pedidos
        env:
          MILLENNIUM_URL:  ${{ secrets.MILLENNIUM_URL }}
          MILLENNIUM_USER: ${{ secrets.MILLENNIUM_USER }}
          MILLENNIUM_PASS: ${{ secrets.MILLENNIUM_PASS }}
          VITRINE:         ${{ secrets.VITRINE }}
          GIST_PEDIDOS_ID:    ${{ secrets.GIST_PEDIDOS_ID }}
          GIST_PEDIDOS_TOKEN: ${{ secrets.GIST_PEDIDOS_TOKEN }}
          WORKER_ENABLED: ${{ secrets.WORKER_ENABLED }}
          USA_PROCESSA:   "1"
          APROVAR_STATUS: "1"
          HTTP_TIMEOUT:   "60"
        run: python pedido_worker.py
