name: Faturar pedidos ML -> Millennium

# Direção de ESCRITA: lê a fila de pedidos (gist), cria/fatura no Millennium e
# devolve o resultado (com o XML da NF-e) noutro gist. O canal-ml anexa no ML.
#
# SEGURANÇA: FATURAR_ENABLED começa 0 (modo seguro: não cria/fatura nada).
# Ligue o secret FATURAR_ENABLED=1 só depois de confirmar a sequência de status
# com o analista Millennium.

on:
  workflow_dispatch:          # botão "Run workflow" (manual, sob demanda)
  schedule:
    - cron: "*/5 * * * *"     # a cada 5 min drena a fila

permissions:
  contents: read

concurrency:
  group: pedido-worker-millennium
  cancel-in-progress: false

jobs:
  faturar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar worker de pedidos
        env:
          # --- Millennium ---
          MILLENNIUM_URL:  ${{ secrets.MILLENNIUM_URL }}
          MILLENNIUM_USER: ${{ secrets.MILLENNIUM_USER }}
          MILLENNIUM_PASS: ${{ secrets.MILLENNIUM_PASS }}
          VITRINE:         ${{ secrets.VITRINE }}
          # --- Gist da fila/resultado (pode reusar GIST_ID/GIST_TOKEN do estoque) ---
          GIST_PEDIDOS_ID:    ${{ secrets.GIST_PEDIDOS_ID }}
          GIST_PEDIDOS_TOKEN: ${{ secrets.GIST_PEDIDOS_TOKEN }}
          # --- Trava de segurança: 1 liga o faturamento real ---
          FATURAR_ENABLED: ${{ secrets.FATURAR_ENABLED }}
          # --- Sequência (confirmar com analista); literais seguros ---
          PROCESSA_STATUS: "1"
          USA_PROCESSA:    "1"
          USA_LIBERAR:     "1"
          POLL_TRIES:      "20"
          POLL_SLEEP:      "6"
          HTTP_TIMEOUT:    "60"
        run: python pedido_worker.py
